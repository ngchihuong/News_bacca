name: "newscacbac"
services:
  mongodb:
    image: mongo:4.4
    container_name: news_mongo
    restart: unless-stopped
    ports:
      - "27000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: newscacbac
      MONGO_INITDB_ROOT_PASSWORD: "newscacbac"
    volumes:
      - ~/volumes/news-cacbac/mongo_data:/data/db

  minio:
    image: minio/minio
    container_name: news_minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "8887:9000"
      - "8888:9001"
    environment:
      MINIO_ROOT_USER: newscacbac
      MINIO_ROOT_PASSWORD: newscacbac

volumes:
  mongo_data:
  minio_data: